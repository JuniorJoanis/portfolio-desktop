    <style>
      body {
        background-color: #0F1217;

            rgba(148, 163, 184, 0.04) 1px,
            transparent 1px,
            transparent 32px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(148, 163, 184, 0.04) 0,
            rgba(148, 163, 184, 0.04) 1px,

            transparent 32px

            transparent 160px
          );
      }
      
      /* Custom Scrollbar for Windows */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.1);
      }
      ::-webkit-scrollbar-thumb {

        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      .window-shadow {
        box-shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.55);
      }

      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      
      /* Blog prose styles */
      .prose {
        color: #57534E;
        line-height: 1.8;
        font-family: 'DM Sans', sans-serif;
      }
      .prose h2 {
        color: #1C1917;
        font-family: 'Instrument Serif', serif;
        font-size: 1.75rem;
        font-weight: 400;
        margin-top: 3rem;
        margin-bottom: 1.5rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid rgba(28,25,23,0.12);
      }
      .prose h3 {
        color: #1C1917;
        font-family: 'Instrument Serif', serif;
        font-size: 1.35rem;
        font-weight: 400;
        margin-top: 2rem;
        margin-bottom: 1rem;
      }
      .prose p {
        margin-bottom: 1.25rem;
      }
      .prose a {
        color: #1C1917;
        text-decoration: underline;
        text-decoration-color: rgba(28,25,23,0.3);
        text-underline-offset: 3px;
      }
      .prose a:hover {
        text-decoration-color: #1C1917;
      }
      .prose strong {
        color: #1C1917;
        font-weight: 600;
      }
      .prose code {
        color: #1C1917;
        background: rgba(28,25,23,0.06);
        padding: 0.125rem 0.375rem;
        border-radius: 0.25rem;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.875rem;
      }
      .prose pre {
        background: #1C1917;
        border: 1px solid rgba(28,25,23,0.15);
        border-radius: 0.75rem;
        padding: 1.25rem;
        overflow-x: auto;
        margin: 1.5rem 0;
      }
      .prose pre code {
        background: none;
        padding: 0;
        color: #e2e8f0;
        font-size: 0.875rem;
        line-height: 1.7;
      }
      
      /* Prism.js custom theme overrides */
      .prose pre[class*="language-"] {
        background: #1C1917;
        border: 1px solid rgba(28,25,23,0.15);
        border-radius: 0.75rem;
        padding: 1.25rem;
        margin: 1.5rem 0;
      }
      .prose code[class*="language-"] {
        background: none;
        text-shadow: none;
      }
      /* Token colors for Ruby syntax */
      .token.comment,
      .token.prolog,
      .token.doctype,
      .token.cdata { color: #6a737d; }
      .token.punctuation { color: #94a3b8; }
      .token.property,
      .token.tag,
      .token.boolean,
      .token.number,
      .token.constant,
      .token.symbol,
      .token.deleted { color: #f472b6; }
      .token.selector,
      .token.attr-name,
      .token.string,
      .token.char,
      .token.builtin,
      .token.inserted { color: #a5f3fc; }
      .token.operator,
      .token.entity,
      .token.url,
      .language-css .token.string,
      .style .token.string { color: #fcd34d; }
      .token.atrule,
      .token.attr-value,
      .token.keyword { color: #c4b5fd; }
      .token.function,
      .token.class-name { color: #5eead4; }
      .token.regex,
      .token.important,
      .token.variable { color: #fb923c; }
      .prose ul, .prose ol {
        margin: 1.25rem 0;
        padding-left: 1.5rem;
      }
      .prose li {
        margin: 0.5rem 0;
      }
      .prose li::marker {
        color: #A8A29E;
      }
      .prose blockquote {
        border-left: 3px solid #A8A29E;
        background: rgba(28,25,23,0.04);
        padding: 0.5rem 1.5rem;
        border-radius: 0 0.5rem 0.5rem 0;
        margin: 1.5rem 0;
        font-style: italic;
      }
      .prose hr {
        border-color: rgba(28,25,23,0.1);
        margin: 2rem 0;
      }
      /* Blog tables */
      .prose .table-wrap {
        overflow-x: auto;
        margin: 1.75rem 0;
        border: 1px solid rgba(28,25,23,0.12);
        border-radius: 0.75rem;
        background: #FFFFFF;
      }
      .prose table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.875rem;
        line-height: 1.5;
        margin: 0;
      }
      .prose thead th {
        background: rgba(28,25,23,0.04);
        color: #1C1917;
        font-weight: 600;
        text-align: left;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid rgba(28,25,23,0.12);
        white-space: nowrap;
      }
      .prose tbody td {
        padding: 0.7rem 1rem;
        border-bottom: 1px solid rgba(28,25,23,0.08);
        vertical-align: top;
      }
      .prose tbody tr:last-child td {
        border-bottom: none;
      }
      .prose tbody tr:nth-child(even) td {
        background: rgba(28,25,23,0.02);
      }
      
      /* Line clamp utility */
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .line-clamp-3 {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      
      /* Global Loading Screen */
      .loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FAFAF9;
        transition: opacity 0.5s ease-out;
      }
      .loading-screen.fade-out {
        opacity: 0;
      }
      .loading-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0 1.5rem;
        animation: loading-fade-in 0.6s ease-out forwards;
      }
      .loading-name {
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: rgba(28, 25, 23, 0.45);
      }
      .loading-ventures {
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 0.04em;
        color: rgba(28, 25, 23, 0.9);
        font-family: 'Instrument Serif', serif;
        margin-top: 0.5rem;
      }
      @media (min-width: 640px) {
        .loading-ventures { font-size: 1.75rem; }
      }
      .loading-dots {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        margin-top: 1.5rem;
      }
      .loading-dots span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(28, 25, 23, 0.3);
        animation: loading-dot-pulse 1.1s ease-in-out infinite;
      }
      .loading-dots span:nth-child(2) { animation-delay: 0.15s; }
      .loading-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes loading-fade-in {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes loading-dot-pulse {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.25); }
      }
    </style>
</head>

    <!-- Loading screen fade out -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loader = document.getElementById('loading-screen');
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(function() {
              loader.style.display = 'none';
            }, 500);
          }
        }, 500);
      });
    </script>
